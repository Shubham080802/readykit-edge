name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev,console]"

      - name: Lint
        run: ruff check .

      - name: Types
        run: mypy

      # Also builds the firmware against a stub Arduino.h, three ways:
      #   - the whole sketch, under five pin configurations, so every branch
      #     of the onboard-LED guards is compiled at least once
      #   - rkRenderPanel(), asserting what the LEDs actually show
      #   - protocol.h, checking the MCU parser agrees with the Python encoder
      # The safety argument assumes the two protocol implementations match and
      # that the panel never contradicts the lock. This is what enforces both.
      - name: Tests
        run: pytest -q

      # Drives every command through the real argument parser and checks the
      # exit codes. The unit tests prove the pieces; this proves the thing
      # someone actually types.
      - name: Live command audit
        run: bash scripts/live-audit.sh
