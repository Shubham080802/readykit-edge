[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "readykit-edge"
version = "0.1.0"
description = "Air-gapped visual kit inspection with physical actuation, for Snapdragon X Elite + Arduino UNO Q"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["fastapi>=0.110"]

[project.optional-dependencies]
host = ["opencv-python>=4.9", "numpy>=1.26", "pyserial>=3.5"]
console = ["uvicorn>=0.29"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.10", "httpx>=0.27"]

[project.scripts]
readykit = "readykit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/readykit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 90
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]

# Optional hardware dependencies with no published stubs. `geniex` ships with
# the Qualcomm AI Engine Direct SDK and exists only on the Snapdragon host, so
# it is unresolvable anywhere else by design - including in CI. Each is
# imported inside a try/except that raises a typed domain error, and the
# handle is held as Any.
[[tool.mypy.overrides]]
module = ["cv2", "serial", "serial.*", "geniex"]
ignore_missing_imports = true
